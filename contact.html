
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toyota Customer Enquiry Form</title>
</head>

<body>

   
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="service.html">Service</a>
        <a href="contact.html">Contact</a>
    </nav>

    <hr>

   
    <form>

        <center>
            <h1>Customer Enquiry Form</h1>
        </center>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name"
            placeholder="Enter your name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
            placeholder="Enter your email" required>
        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone"
            placeholder="Enter your phone number">
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age">
        <br><br>

        
        <label>Gender:</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <br><br>

       
        <label for="model">Preferred Toyota Car:</label>
        <select id="model" name="model">
            <option value="">Select Model</option>
            <option value="corolla">Toyota Corolla</option>
            <option value="camry">Toyota Camry</option>
            <option value="fortuner">Toyota Fortuner</option>
            <option value="innova">Toyota Innova</option>
            <option value="hyryder">Toyota Hyryder</option>
        </select>

        <br><br>

        
        <label for="date">Test Drive Date:</label>
        <input type="date" id="date" name="date">
        <br><br>

      
        <label for="license">Upload Driving License:</label>
        <input type="file" id="license" name="license">
        <br><br>

       
        <label for="comments">Comments:</label>
        <textarea id="comments" name="comments"
            placeholder="Your comments"></textarea>

        <br><br>

       
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
